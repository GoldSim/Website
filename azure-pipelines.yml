# ASP.NET Core
# Build the front-end assets and the ASP.NET Core project, then deploy it to the test web app.
# https://learn.microsoft.com/azure/devops/pipelines/ecosystems/dotnet-core

trigger:
- '*'

pr: none

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

steps:

- task: UseNode@1
  inputs:
    version: '26.x'

- task: Npm@1
  inputs:
    command: 'install'

- task: Gulp@1
  inputs:
    gulpFile: 'gulpfile.js'
    targets:
    enableCodeCoverage: false

- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '10.0.x'

- task: DotNetCoreCLI@2
  inputs:
    command: 'restore'
    projects: 'GoldSim.Web.csproj'
    feedsToUse: 'config'
    nugetConfigPath: 'NuGet.config'
    externalFeedCredentials: 'Ignia NuGet Server'

- task: DotNetCoreCLI@2
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: 'GoldSim.Web.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory) --no-restore'
    zipAfterPublish: true

- task: AzureRmWebAppDeployment@4
  inputs:
    ConnectionType: 'AzureRM'
    azureSubscription: 'Azure Subscription'
    appType: 'webApp'
    WebAppName: 'GoldSimWebTest'
    packageForLinux: '$(Build.ArtifactStagingDirectory)/**/*.zip'
    enableCustomDeployment: true
    DeploymentType: 'webDeploy'
    enableXmlTransform: false
    enableXmlVariableSubstitution: false
    RemoveAdditionalFilesFlag: true
    AdditionalArguments: '-retryAttempts:6 -retryInterval:10000'